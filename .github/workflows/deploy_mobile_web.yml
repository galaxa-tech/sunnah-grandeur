name: Deploy Mobile Web App to Firebase Hosting

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./app-mobile

      - name: Run Static Code Analysis
        run: flutter analyze
        working-directory: ./app-mobile

      # Same gitignored api_keys.json the Android build reconstructs, so the
      # web app gets the Places/Maps key too (Masjid Finder).
      - name: Write api_keys.json from secrets
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          STRIPE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          cat > app-mobile/api_keys.json <<EOF
          {
            "PLACES_API_KEY": "${PLACES_API_KEY}",
            "STRIPE_KEY": "${STRIPE_KEY}"
          }
          EOF

      - name: Build Flutter Web (Release)
        run: |
          flutter build web --release --dart-define-from-file=api_keys.json
          node scripts/inject_maps_key.js || echo "::warning::Maps key not injected"
        working-directory: ./app-mobile

      - name: Deploy to Firebase Hosting (app target, live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUNNAH_GRANDEUR }}'
          projectId: sunnah-grandeur
          target: app
          channelId: live
