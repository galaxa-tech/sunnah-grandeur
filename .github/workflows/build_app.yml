name: Build & Release Mobile App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./app-mobile

      - name: Run Static Code Analysis
        run: flutter analyze
        working-directory: ./app-mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: ./app-mobile

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release
        working-directory: ./app-mobile

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app-mobile/build/app/outputs/bundle/release/app-release.aab

  build-web:
    name: Build Flutter Web App (Firebase Hosting "app" target)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./app-mobile

      - name: Build Web Release
        run: flutter build web --release
        working-directory: ./app-mobile

      # Placeholder API keys shipping to production is exactly how Masjid
      # Finder ended up silently broken on the live site — fail the build
      # instead of letting that happen again unnoticed.
      - name: Fail on placeholder API keys in the build output
        run: |
          if grep -rIl "YOUR_GOOGLE_MAPS_API_KEY\|YOUR_.*_API_KEY\|sk_test_placeholder" app-mobile/build/web/; then
            echo "::error::Placeholder API key found in the web build output — see files listed above."
            exit 1
          fi
        working-directory: .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-web-build
          path: app-mobile/build/web
