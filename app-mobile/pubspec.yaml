name: sunnah_grandeur
description: Sunnah Grandeur — Islamic Lifestyle App UI Prototype
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: 6.3.3
  provider: 6.1.5+1
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  google_sign_in: ^6.2.1
  cloud_firestore: 5.6.12
  cloud_functions: 5.6.2
  firebase_storage: 12.4.10
  flutter_stripe: 12.6.0
  flutter_qiblah: 3.2.0
  youtube_player_flutter: 9.1.3
  shared_preferences: 2.5.5
  adhan: 2.0.0+1
  intl: ^0.20.3
  geolocator: 14.0.2
  share_plus: 10.1.4
  google_maps_flutter: 2.9.0
  just_audio: 0.9.42
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  http: 1.2.2
  url_launcher: ^6.3.1
  geocoding: ^3.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

# flutter_native_splash config — run `dart run flutter_native_splash:create`
# after `flutter pub get` to (re)generate the native splash assets for both
# platforms from this. Matches AppColors.dark (near-black bg, gold logo glow)
# so cold start reads as branded instead of a flash of white.
flutter_native_splash:
  color: "#0D0D0F"
  image: assets/images/logo.png
  color_dark: "#0D0D0F"
  image_dark: assets/images/logo.png
  android_12:
    color: "#0D0D0F"
    image: assets/images/logo.png
    color_dark: "#0D0D0F"
    image_dark: assets/images/logo.png
  # false: only the splash is branded, status bar stays normal once Flutter
  # takes over. `true` would set UIStatusBarHidden statically in Info.plist
  # with nothing in this app wired to restore it afterward, hiding the
  # status bar app-wide — not just during splash.
  fullscreen: false
